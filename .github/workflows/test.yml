name: Build and Deploy to ECS

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 241765568283.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: simple-node-demo
  ECS_CLUSTER: simple-node-demo-cluster
  ECS_SERVICE: simple-node-demo-service
  ECS_TASK_DEFINITION: simple-node-demo
  CONTAINER_NAME: simple-node-demo

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v6

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # Run application tests
      - name: Run tests
        run: npm test

      # Configure AWS using GitHub OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::241765568283:role/GitHubActions-ECR-simple-node-demo
          aws-region: ${{ env.AWS_REGION }}

      # Verify AWS identity
      - name: Verify AWS identity
        run: aws sts get-caller-identity

      # Login to ECR
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} \
            .

      # Push Docker image to ECR
      - name: Push Docker image
        run: |
          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}

      # Download current ECS task definition
      - name: Get current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition $ECS_TASK_DEFINITION \
            --query taskDefinition \
            --output json > task-definition.json

      # Update container image in task definition
      - name: Update ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}

      # Deploy the new task definition to ECS
      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true